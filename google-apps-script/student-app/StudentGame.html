<!DOCTYPE html>

<head>

<body>
  <main id="loginScreen" class="login-screen">
    <div class="login-background" aria-hidden="true"></div>
    <div class="login-card">
      <img class="game-logo" src="assets/ui/login/game_logo.png" alt="Vocab Farm Island">

      <h1>Welcome to Vocab Farm Island!</h1>
      <div class="login-fields">
        <label for="studentSelect">Student number</label>

        <label for="passcode">Passcode</label>
        <input id="passcode" type="password" maxlength="6" inputmode="numeric" pattern="[0-9]{4}|[0-9]{6}" autocomplete="off" placeholder="Enter your passcode" aria-label="Passcode">
        <p id="loginError" class="field-error" role="alert"></p>
        <button id="playButton" class="primary-btn full-btn" type="button">🌿 Enter the Island</button>
        <button id="recoverLoginButton" class="secondary-btn full-btn" type="button">🛟 Recover an existing test profile</button>
      </div>
    </div>
  </main>

  <main id="gameShell" class="game-shell hidden">
    <canvas id="gameCanvas" aria-label="Playable two-island farm map. Use arrow keys, WASD, or touch controls to move." tabindex="0"></canvas>
    <div class="map-vignette" aria-hidden="true"></div>
    <header class="hud" id="playerHud">

        <div class="hud-rank" id="hudRank">Novice</div>
        <div class="hud-gold"><img src="assets/items/currency/64/gold_coin.png" alt=""> <strong id="hudGold">30</strong><span> gold</span></div>
        <div class="xp-line"><span>XP</span><span id="hudXPLabel">0 / 50</span></div>
        <div class="xp-track"><div id="hudXPBar"></div></div>
        <div class="hud-save-state" id="saveStatus" data-state="saved" role="status" aria-live="polite">○ Save not checked</div>
      </div>
    </header>
    <nav class="top-buttons" aria-label="Game menus">
      <button class="icon-btn" id="inventoryButton" title="Inventory (I)"><img src="assets/ui/icons/64/icon_inventory.png" alt=""><span>Bag</span></button>
      <button class="icon-btn" id="missionsButton" title="Daily and weekly challenges"><img src="assets/ui/badges/64/badge_daily.png" alt=""><span>Daily/<wbr>Weekly</span></button>

    <div id="updateNotice" class="safe-update-notice hidden" role="status"><strong>New version available</strong><span>Your local save is retained. Make a recovery copy before future updates.</span><button id="updateBackup" type="button">Backup</button><button id="updateLater" type="button">Later</button></div>

    <div id="areaHint" class="area-hint" aria-live="polite"><span class="area-dot"></span><span id="areaName">Main Island</span></div>
    <button id="placementCancel" type="button" class="placement-cancel hidden" aria-live="polite">✕ Cancel placement · Hủy đặt</button>
    <div id="fenceOrientation" class="fence-orientation hidden" role="group" aria-label="Fence orientation before placement">
      <button type="button" data-fence-orient="h" aria-pressed="true">↔ Horizontal · Ngang</button>
      <button type="button" data-fence-orient="v" aria-pressed="false">↕ Vertical · Dọc</button>
    </div>
    <div id="petSpeechBubble" class="pet-speech-bubble hidden" aria-live="polite"><span id="petSpeechText"></span></div>
    <div id="worldNotice" class="world-notice hidden" aria-live="polite"></div>

    <nav class="travel-nav quick-menus-v023" aria-label="Island menus">
      <button type="button" data-menu="decorations" title="View your owned decorations and fences. Place an item, then press and hold it on the island to move or return it.">🌺 <span>Decorations</span></button>
      <button type="button" data-menu="seeds" title="View your owned regular seeds and Special Seeds, then choose an empty planting plot.">🌱 <span>Seeds</span></button>
      <button type="button" data-menu="collection" title="View your magical companion collection.">⭐ <span>Collection</span></button>
    </nav>
    <nav class="zoom-controls" aria-label="Map zoom controls">
      <button id="zoomIn" type="button" aria-label="Zoom in">+</button>
      <span id="zoomValue" aria-live="polite">100%</span>
      <button id="zoomOut" type="button" aria-label="Zoom out">−</button>
    </nav>
    <div class="mobile-controls" aria-label="Touch movement controls">
      <div id="movementJoystick" class="movement-joystick" role="group" aria-label="Drag to move in any direction">
        <div class="joystick-knob" aria-hidden="true"></div>
      </div>
    </div>
    <div id="farmActionBanner" class="farm-action-banner hidden" role="status" aria-live="polite"><span id="farmActionLabel">Planting...</span><div class="farm-action-track"><div id="farmActionBar"></div></div><small>2 seconds</small></div>
    <div id="toastStack" class="toast-stack" aria-live="polite"></div>
  </main>

  <div id="modalOverlay" class="modal-overlay hidden" role="presentation">
    <div class="modal" id="modalPanel" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-heading"><div><p class="eyebrow" id="modalEyebrow">VOCAB FARM ISLAND</p><h2 id="modalTitle">Island</h2></div><button class="close-btn" id="modalClose" type="button" aria-label="Close window">×</button></div>
      <div id="modalBody" class="modal-body"></div>
    </div>
  </div>
  <div id="farmCooldown" class="farm-cooldown hidden" role="status" aria-live="polite">Try again in <strong id="farmCooldownTime">0:10</strong></div>

  <script><?!= include("MapConfig"); ?></script>
  <script><?!= include("WalkMask"); ?></script>
  <script><?!= include("RecoveryCode"); ?></script>
  <script><?!= include("GameCode"); ?></script>
  <noscript>This game needs JavaScript. Please enable JavaScript in your browser.</noscript>

  <script>
  /* v0.33: Keep Bag and other top menu buttons below the real HUD height on phones. */
  (() => {
    const shell = document.getElementById('gameShell');
    const hud = document.getElementById('playerHud');
    const topMenu = shell && shell.querySelector('.top-buttons');
    if (!shell || !hud || !topMenu) return;
    let pending = false;
    function measure() {
      pending = false;
      if (!window.matchMedia('(max-width: 720px)').matches || shell.classList.contains('hidden')) {
        shell.style.removeProperty('--vfi-top-buttons-y');
        shell.style.removeProperty('--vfi-top-menu-bottom');
        return;
      }
      const hudBottom = Math.ceil(hud.getBoundingClientRect().bottom);
      const menuTop = Math.max(100, hudBottom + 12);
      shell.style.setProperty('--vfi-top-buttons-y', menuTop + 'px');
      shell.style.setProperty('--vfi-top-menu-bottom', (menuTop + topMenu.getBoundingClientRect().height) + 'px');
    }
    function update() {
      if (pending) return;
      pending = true;
      requestAnimationFrame(measure);
    }
    if (window.ResizeObserver) new ResizeObserver(update).observe(hud);
    new MutationObserver(update).observe(shell,{attributes:true,attributeFilter:['class']});
    window.addEventListener('resize', update, {passive:true});
    window.addEventListener('orientationchange', update, {passive:true});
    update();
  })();
  </script>
</body>
</html>
