<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#357345">
  <title>Vocab Farm Island · Classroom Game</title>
  <style>
    :root{font-family:'Trebuchet MS',Arial,sans-serif;color:#493422;background:#dff4c9}
    *{box-sizing:border-box}
    body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:linear-gradient(160deg,#c5ecb1,#e8f6d8 48%,#c2e5ef)}
    main{width:min(100%,480px);padding:32px;border:3px solid #9a6d3d;border-radius:24px;text-align:center;background:#fff8df;box-shadow:0 18px 45px #315b3a45}
    img{width:min(100%,260px);height:auto}
    h1{font-size:clamp(25px,6vw,35px);margin:8px 0}
    p{line-height:1.5}
    a{display:inline-block;margin:12px 0;padding:15px 26px;border-radius:14px;background:#357345;color:white;font-size:18px;font-weight:bold;text-decoration:none}
    a:focus-visible{outline:3px solid #f4af36;outline-offset:4px}
    small{display:block;color:#806d55}
  </style>
</head>
<body>
  <main>
    <img src="assets/ui/login/game_logo.png" alt="Vocab Farm Island">
    <h1>Classroom game</h1>
    <p>Open the online game to use your teacher's vocabulary and save progress across devices.</p>
    <a id="playLink" href="https://script.google.com/macros/s/AKfycbzR8cL6fbcl12eF1W53k1C_4jvy0Yj1PUgL670kOVYO0SlvP06S1e0_HCZYIcqlsuqh_A/exec">Play Vocab Farm Island</a>
    <small>Students need their own four-digit passcode from the teacher.</small>
  </main>
  <script>
    const gameUrl = document.getElementById('playLink').href;
    if (gameUrl.startsWith('https://script.google.com/macros/s/') && gameUrl.endsWith('/exec')) {
      window.location.replace(gameUrl);
    }
  </script>
</body>
</html>
